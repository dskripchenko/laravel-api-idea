name: Publish

# Publishing on a tag — but not on the fact of a tag: the version in
# build.gradle.kts has to match it. A tag can also sit on a release that is not
# going to the Marketplace at all.
#
# The FIRST version cannot go this way: the Marketplace accepts it only through
# the web form and moderates it by hand. This workflow is for every one after.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency: publish

jobs:
  publish:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the tag against the version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(grep -m1 '^version = ' build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "The tag says $GITHUB_REF_NAME and build.gradle.kts says $PLUGIN_VERSION — nothing to publish."
            exit 1
          fi

      # A tag can sit on a commit the main CI never ran: that one walks
      # branches. Nothing unverified goes to the registry — a version cannot be
      # taken back from it.
      - name: Test
        run: ./gradlew test

      - name: Verify against supported IDEs
        run: ./gradlew verifyPlugin

      - name: Publish
        run: ./gradlew publishPlugin
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          PLUGIN_CERTIFICATE_CHAIN: ${{ secrets.PLUGIN_CERTIFICATE_CHAIN }}
          PLUGIN_PRIVATE_KEY: ${{ secrets.PLUGIN_PRIVATE_KEY }}
          PLUGIN_PRIVATE_KEY_PASSWORD: ${{ secrets.PLUGIN_PRIVATE_KEY_PASSWORD }}

  # A separate job, and the separation is a correction: the upload used to be
  # the last step of publishing, so a 403 on it reported as "publishing failed"
  # when the version was already live in the Marketplace — and re-running to fix
  # the upload would have tried to publish the same version twice. This one
  # re-runs on its own. It signs its own copy rather than carrying one over,
  # since jobs share no workspace and a rebuild from the same tag is the same
  # artifact.
  attach:
    name: Attach the plugin archive to the release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and sign
        run: ./gradlew signPlugin
        env:
          PLUGIN_CERTIFICATE_CHAIN: ${{ secrets.PLUGIN_CERTIFICATE_CHAIN }}
          PLUGIN_PRIVATE_KEY: ${{ secrets.PLUGIN_PRIVATE_KEY }}
          PLUGIN_PRIVATE_KEY_PASSWORD: ${{ secrets.PLUGIN_PRIVATE_KEY_PASSWORD }}

      # Until now a release carried the sources only: installing the plugin by
      # hand — from a closed network, onto an IDE that cannot reach the
      # registry, or simply to go back one version — meant building it.
      - name: Upload it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # The signed one when signing happened: the IDE checks the signature
          # on a registry install, and handing out a less trusted artifact than
          # the published one means handing out a different one.
          ASSET="build/distributions/laravel-api-idea-${VERSION}-signed.zip"
          [ -f "$ASSET" ] || ASSET="build/distributions/laravel-api-idea-${VERSION}.zip"

          if [ ! -f "$ASSET" ]; then
            echo "No built archive at $ASSET"
            exit 1
          fi

          cp "$ASSET" "laravel-api-idea-${VERSION}.zip"

          # The release is usually already there, made by hand with a title an
          # automaton would not come up with. If it is not, one is created from
          # the CHANGELOG so the archive has somewhere to go.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            python3 - <<'PY' > notes.md
          import os, re, pathlib

          version = os.environ['GITHUB_REF_NAME'].lstrip('v')
          lines = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8').split('\n')
          heads = [(i, line) for i, line in enumerate(lines) if line.startswith('## ')]

          for index, (start, line) in enumerate(heads):
              if re.match(r'^## \[?' + re.escape(version) + r'\]?( |$)', line):
                  end = heads[index + 1][0] if index + 1 < len(heads) else len(lines)
                  print('\n'.join(lines[start + 1:end]).strip())
                  break
          else:
              raise SystemExit(f'CHANGELOG.md says nothing about {version}')
          PY
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi

          gh release upload "$GITHUB_REF_NAME" "laravel-api-idea-${VERSION}.zip" --clobber
