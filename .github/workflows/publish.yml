name: Publish

# Публикация по тегу — но не по факту тега: версия в build.gradle.kts должна
# совпасть с ним. Тег может стоять и на релизе, который в Marketplace не едет.
#
# ПЕРВУЮ версию так выложить нельзя: Marketplace принимает её только через
# веб-форму и проводит ручную модерацию. Этот workflow — для всех последующих.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency: publish

jobs:
  publish:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the tag against the version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(grep -m1 '^version = ' build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Тег $GITHUB_REF_NAME, а в build.gradle.kts $PLUGIN_VERSION — публиковать нечего."
            exit 1
          fi

      # Тег может стоять на коммите, который основной CI не гонял: он ходит по
      # веткам. В реестр непроверенное не уезжает — оттуда версию не отозвать.
      - name: Test
        run: ./gradlew test -PphpstormVersion=2025.2

      - name: Verify against supported IDEs
        run: ./gradlew verifyPlugin -PphpstormVersion=2025.2

      - name: Publish
        run: ./gradlew publishPlugin -PphpstormVersion=2025.2
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          PLUGIN_CERTIFICATE_CHAIN: ${{ secrets.PLUGIN_CERTIFICATE_CHAIN }}
          PLUGIN_PRIVATE_KEY: ${{ secrets.PLUGIN_PRIVATE_KEY }}
          PLUGIN_PRIVATE_KEY_PASSWORD: ${{ secrets.PLUGIN_PRIVATE_KEY_PASSWORD }}
