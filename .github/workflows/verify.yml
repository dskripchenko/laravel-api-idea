name: Verify

# Compatibility with the IDEs — weekly, and on demand.
#
# The check answers "did a new platform release break us", not "did we break
# ourselves": its answer changes with JetBrains' releases, not with commits to
# this repository. Running it on every push means six downloaded IDE
# distributions for a result that has not changed.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  verify:
    name: Verify against supported IDEs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify
        run: ./gradlew verifyPlugin

      - name: Upload the verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: build/reports/pluginVerifier/
