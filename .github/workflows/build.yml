name: Build

# Every push and every pull request: the tests.
#
# The verifier does NOT run here, and that is measured rather than assumed: the
# first run took 13.5 minutes, of which 6.5 were downloading six IDE
# distributions and another 3 were saving the cache they had bloated. And its
# answer changes with a new platform release, not with our edits. So it lives in
# verify.yml on a schedule, and in publish.yml before publishing.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Public text carries no context of ours
        # The description, the release notes and the README are read by people
        # who know nothing about our applications. An endpoint name from a
        # closed project explains nothing to them and shows what was not meant
        # to be shown. Caught here because four releases in a row it was not
        # caught by eye.
        run: |
          if grep -rniE "print-form|printable|AdminApiModule|laravel-admin|dev-cloud" \
              CHANGELOG.md README.md src/main/resources/META-INF/plugin.xml; then
            echo "::error::public text names a specific project — replace the example with a neutral one"
            exit 1
          fi

      - name: Test
        run: ./gradlew test

      - name: Build the plugin archive
        run: ./gradlew buildPlugin

      - name: Upload the plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/distributions/*.zip
