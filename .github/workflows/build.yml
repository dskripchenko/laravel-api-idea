name: Build

# Каждый пуш и каждый PR: тесты.
#
# Верификатор здесь НЕ гоняется, и это измерено, а не предположено: первый
# прогон занял 13.5 минуты, из которых 6.5 — скачивание шести дистрибутивов IDE
# и ещё 3 — сохранение раздувшегося кэша. При этом его ответ меняется не от
# наших правок, а от выхода новой версии платформы. Поэтому он живёт в
# verify.yml по расписанию и в publish.yml перед публикацией.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      - name: Build the plugin archive
        run: ./gradlew buildPlugin

      - name: Upload the plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/distributions/*.zip
